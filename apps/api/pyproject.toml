[project]
name = "fasalalert-api"
version = "0.1.0"
description = "FasalAlert API: microclimate decision engine for Maharashtra smallholders"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0.36",
  "alembic>=1.14",
  "psycopg[binary]>=3.2",
  "geoalchemy2>=0.16",
  "shapely>=2.0",
  "pgvector>=0.3.6",
  "httpx>=0.28",
  "tenacity>=9.0",
  "pyjwt>=2.10",
  "apscheduler>=3.10,<4",
  "numpy>=2.0",
  "pandas>=2.2",
  "pyarrow>=18",
  "scikit-learn>=1.5",
  "lightgbm>=4.5",
  "statsmodels>=0.14",
  "joblib>=1.4",
  "matplotlib>=3.9",
  "fastembed>=0.4",
  "pypdf>=5.1",
  "beautifulsoup4>=4.12",
  "pywebpush>=2.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-cov>=6.0", "ruff>=0.8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m \"not network\""
markers = [
  "network: test needs internet access to a public API",
  "db: test needs the Postgres test database",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = ["B008", "E501", "E731"]
